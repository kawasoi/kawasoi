<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>通信 | 川添い</title>
  <link rel="icon" type="image/svg+xml" href="images/favicon.svg">
  <style>
    * { font-weight: 700 !important; }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --navy:       #013d72;
      --navy-mid:   rgba(1,61,114,0.55);
      --navy-faint: rgba(1,61,114,0.14);
    }

    html { scroll-behavior: smooth; font-size: 16px; }
    body {
      font-family: "Yu Mincho", "游明朝", "YuMincho",
                   "Hiragino Mincho ProN", "Hiragino Mincho Pro", serif;
      font-weight: 700;
      background: #ffffff;
      color: var(--navy);
      line-height: 2.2;
      overflow-x: hidden;
    }

    /* ── Header ── */
    .site-header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      z-index: 200;
      height: 116px;
      background: rgba(255,255,255,0.92);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 1.4rem;
      transition: background-color 0.3s ease;
    }
    .site-header:hover { background-color: #D0E0EF; }
    .header-logo { display: block; text-decoration: none; }
    .header-logo img {
      height: 100px;
      width: auto;
      display: block;
      transition: opacity 0.3s ease;
    }
    .site-header:hover .header-logo img { opacity: 0.3; }
    .hamburger {
      background: none;
      border: none;
      cursor: pointer;
      font-family: "Yu Mincho", "游明朝", serif;
      font-size: 2rem;
      color: var(--navy);
      line-height: 1;
      padding: 0 0.2rem;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color 0.3s ease;
    }
    .site-header:hover .hamburger { color: var(--navy); }

    /* ── Nav Overlay ── */
    .nav-overlay {
      position: fixed;
      inset: 0;
      z-index: 190;
      background: rgba(255,255,255,0.97);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3rem;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }
    .nav-overlay.open { opacity: 1; pointer-events: all; }
    .nav-overlay a {
      text-decoration: none;
      color: var(--navy);
      font-size: 1.05rem;
      letter-spacing: 0.45em;
      transition: opacity 0.2s;
    }
    .nav-overlay a:hover { opacity: 0.5; }
    .nav-close {
      position: absolute;
      top: 14px;
      right: 1.4rem;
      background: none;
      border: none;
      cursor: pointer;
      font-family: "Yu Mincho", "游明朝", serif;
      font-size: 1.5rem;
      color: var(--navy);
      line-height: 1;
    }

    /* ── Page ── */
    .page {
      max-width: 720px;
      margin: 0 auto;
      padding-top: 116px;
    }

    /* ── Hero image ── */
    .tsushin-hero {
      width: 100vw;
      margin-left: calc(50% - 50vw);
      height: 60vw;
      object-fit: cover;
      object-position: center;
      display: block;
    }

    /* ── Heading ── */
    .tsushin-page-heading {
      text-align: center;
      font-size: 1.45rem;
      letter-spacing: 0.22em;
      color: var(--navy);
      font-weight: 700;
      padding: 3.5rem 0 3rem;
    }

    /* ── Article list ── */
    .article-list {
      list-style: none;
      padding: 0 1.6rem;
    }
    .article-item {
      border-bottom: 1px solid rgba(1,61,114,0.15);
      padding: 2.4rem 0;
    }
    .article-item:first-child {
      border-top: 1px solid rgba(1,61,114,0.15);
    }
    .article-meta {
      display: flex;
      align-items: center;
      gap: 0.6em;
      font-family: "Yu Mincho", "游明朝", "YuMincho",
                   "Hiragino Mincho ProN", "Hiragino Mincho Pro", serif;
      font-size: 0.85rem;
      letter-spacing: 0.12em;
      color: var(--navy);
      margin-bottom: 1.2rem;
    }
    .article-meta-divider {
      display: inline-block;
      width: 1px;
      height: 0.85em;
      background: currentColor;
      opacity: 0.5;
      flex-shrink: 0;
    }
    .article-excerpt {
      font-size: 0.78rem;
      line-height: 2.2;
      color: var(--navy);
      opacity: 0.65;
      letter-spacing: 0.04em;
      margin-bottom: 1.2rem;
      word-break: normal;
      overflow-wrap: break-word;
    }
    .article-toc {
      list-style: none;
      margin-bottom: 1.2rem;
    }
    .article-toc li {
      font-size: 0.78rem;
      letter-spacing: 0.08em;
      color: var(--navy);
      line-height: 2;
      padding-left: 1em;
      text-indent: -1em;
    }
    .article-toc li::before {
      content: '・';
    }
    .article-read-more {
      display: inline-block;
      font-size: 0.72rem;
      letter-spacing: 0.3em;
      color: var(--navy);
      text-decoration: none;
      border: 1px solid rgba(1,61,114,0.45);
      padding: 0.45rem 1.4rem;
      transition: background 0.2s, border-color 0.2s;
    }
    .article-read-more:hover {
      background: rgba(1,61,114,0.06);
      border-color: var(--navy);
    }

    /* ── Footer ── */
    footer {
      background: #ffffff;
      border-top: 1px solid rgba(1,61,114,0.15);
      padding: 2.8rem 1.6rem;
      margin-top: 4rem;
    }
    .footer-inner {
      max-width: 720px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: stretch;
      gap: 1.5rem;
    }
    .footer-shop-name {
      font-size: 1.05rem;
      letter-spacing: 0.2em;
      color: var(--navy);
      margin-bottom: 0.8rem;
    }
    .footer-info {
      font-size: 0.7rem;
      line-height: 2;
      color: var(--navy);
      letter-spacing: 0.04em;
    }
    .footer-right {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      justify-content: space-between;
    }
    .footer-instagram {
      display: flex;
      align-items: center;
      gap: 0.45em;
      font-size: 0.72rem;
      letter-spacing: 0.12em;
      color: var(--navy);
      text-decoration: none;
      opacity: 0.7;
      transition: opacity 0.2s;
    }
    .footer-instagram:hover { opacity: 1; }
    .footer-copy {
      font-size: 0.6rem;
      letter-spacing: 0.06em;
      color: var(--navy);
      opacity: 0.45;
    }
    @media (min-width: 768px) {
      .tsushin-hero { height: 33vh; }
    }
    @media (max-width: 400px) {
      .footer-shop-name { font-size: 0.9rem; }
      .footer-info { font-size: 0.62rem; }
      .footer-instagram { font-size: 0.62rem; }
      .footer-copy { font-size: 0.55rem; }
    }

    /* ── Fade-in ── */
    .fi {
      opacity: 0;
      transform: translateY(14px);
      transition: opacity 0.75s ease, transform 0.75s ease;
    }
    .fi.vis { opacity: 1; transform: translateY(0); }
  </style>
</head>
<body>

<!-- ══ HEADER ══ -->
<header class="site-header">
  <a href="index.html" class="header-logo">
    <img src="images/kawasoi_logo_vt_transparent.svg" alt="川添い">
  </a>
  <button class="hamburger" id="menuOpen" aria-label="メニューを開く">〜</button>
</header>

<!-- ══ NAV OVERLAY ══ -->
<div class="nav-overlay" id="navOverlay" role="dialog" aria-modal="true">
  <button class="nav-close" id="menuClose" aria-label="メニューを閉じる">〜</button>
  <a href="index.html#statement" onclick="closeMenu()">趣旨</a>
  <a href="tsushin.html"         onclick="closeMenu()">通信</a>
  <a href="index.html#kikaku"    onclick="closeMenu()">企画</a>
  <a href="index.html#store"     onclick="closeMenu()">購買</a>
  <a href="index.html#shozai"    onclick="closeMenu()">所在</a>
</div>

<!-- ══ PAGE ══ -->
<div class="page">

  <!-- ヘッダー画像 -->
  <img src="images/kawasoi_sq_4.jpg" alt="川添い通信" class="tsushin-hero fi">

  <!-- 見出し -->
  <h1 class="tsushin-page-heading fi">通信</h1>

  <!-- 記事一覧 -->
  <ul class="article-list" id="articleList">
    <li class="article-item" id="loadingItem" style="text-align:center;opacity:0.5;font-size:0.85rem;letter-spacing:0.1em;border-top:1px solid rgba(1,61,114,0.15);">読み込み中...</li>
  </ul>

  <!-- Footer -->
  <footer>
    <div class="footer-inner">
      <div class="footer-left">
        <p class="footer-shop-name">川添い</p>
        <p class="footer-info">
          〒010-1211<br>
          秋田市雄和椿川字小鹿野戸1-18<br>
          E-mail: post@kawasoi.com
        </p>
      </div>
      <div class="footer-right">
        <a href="https://www.instagram.com/" class="footer-instagram" target="_blank" rel="noopener noreferrer">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="2" width="20" height="20" rx="5" ry="5"/>
            <circle cx="12" cy="12" r="4.5"/>
            <circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/>
          </svg>
        </a>
        <p class="footer-copy">© Kawasoi All Rights Reserved.</p>
      </div>
    </div>
  </footer>

</div><!-- /page -->

<script>
  const overlay = document.getElementById('navOverlay');
  document.getElementById('menuOpen').addEventListener('click', () => {
    overlay.classList.add('open');
  });
  document.getElementById('menuClose').addEventListener('click', closeMenu);
  overlay.addEventListener('click', e => { if (e.target === overlay) closeMenu(); });
  function closeMenu() { overlay.classList.remove('open'); }

  const io = new IntersectionObserver(
    entries => entries.forEach(e => {
      if (e.isIntersecting) { e.target.classList.add('vis'); io.unobserve(e.target); }
    }),
    { threshold: 0.08, rootMargin: '0px 0px -20px 0px' }
  );
  document.querySelectorAll('.fi').forEach(el => io.observe(el));

  function getPropText(prop) {
    if (!prop) return '';
    if (prop.type === 'title') return (prop.title || []).map(t => t.plain_text).join('');
    if (prop.type === 'rich_text') return (prop.rich_text || []).map(t => t.plain_text).join('');
    if (prop.type === 'number') return prop.number != null ? `第${prop.number}号` : '';
    return '';
  }

  function formatDate(str) {
    return str ? str.replace(/-/g, '.') : '';
  }

  async function loadArticles() {
    const list = document.getElementById('articleList');
    try {
      const res = await fetch('/api/notion');
      const data = await res.json();
      const pages = data.results || [];

      list.innerHTML = '';
      pages.forEach(page => {
        const props = page.properties || {};
        const issueNum = getPropText(props['号数']);
        const dateStr = formatDate(props['発行日']?.date?.start || '');
        const bodyText = page.excerpt || '';
        const excerpt = bodyText.length > 100 ? bodyText.slice(0, 100) + '…' : bodyText;
        const toc = page.toc || [];

        const li = document.createElement('li');
        li.className = 'article-item fi';
        li.innerHTML = `
          <p class="article-meta">
            ${dateStr}${dateStr && issueNum ? '<span class="article-meta-divider"></span>' : ''}${issueNum}
          </p>
          ${toc.length > 0 ? `<ul class="article-toc">${toc.map(t => `<li>${t}</li>`).join('')}</ul>` : ''}
          ${excerpt ? `<p class="article-excerpt">${excerpt}</p>` : ''}
          <a href="tsushin-detail.html?id=${page.id}" class="article-read-more">続きを読む</a>
        `;
        list.appendChild(li);
      });

      list.querySelectorAll('.fi').forEach(el => io.observe(el));
    } catch (e) {
      list.innerHTML = '<li class="article-item" style="text-align:center;opacity:0.5;border-top:1px solid rgba(1,61,114,0.15);">記事の取得に失敗しました。</li>';
    }
  }

  loadArticles();
</script>

</body>
</html>
