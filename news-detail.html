<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>お知らせ | 川添い</title>
  <link rel="icon" type="image/svg+xml" href="images/favicon.svg">
  <style>
    * { font-weight: 700 !important; }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --navy:       #013d72;
      --navy-mid:   rgba(1,61,114,0.55);
      --navy-faint: rgba(1,61,114,0.14);
    }

    html { scroll-behavior: smooth; font-size: 16px; }
    body {
      font-family: "Yu Mincho", "游明朝", "YuMincho",
                   "Hiragino Mincho ProN", "Hiragino Mincho Pro", serif;
      font-weight: 700;
      background: #ffffff;
      color: var(--navy);
      line-height: 2.2;
      overflow-x: hidden;
    }

    /* ── Header ── */
    .site-header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      z-index: 200;
      height: 116px;
      background: rgba(255,255,255,0.92);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 1.4rem;
      transition: background-color 0.3s ease;
    }
    .site-header:hover { background-color: #D0E0EF; }
    .header-logo { display: block; text-decoration: none; }
    .header-logo img {
      height: 100px;
      width: auto;
      display: block;
      transition: opacity 0.3s ease;
    }
    .site-header:hover .header-logo img { opacity: 0.3; }
    .hamburger {
      background: none;
      border: none;
      cursor: pointer;
      font-family: "Yu Mincho", "游明朝", serif;
      font-size: 2rem;
      color: var(--navy);
      line-height: 1;
      padding: 0 0.2rem;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color 0.3s ease;
    }
    .site-header:hover .hamburger { color: var(--navy); }

    /* ── Nav Overlay ── */
    .nav-overlay {
      position: fixed;
      inset: 0;
      z-index: 190;
      background: rgba(255,255,255,0.97);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3rem;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }
    .nav-overlay.open { opacity: 1; pointer-events: all; }
    .nav-overlay a {
      text-decoration: none;
      color: var(--navy);
      font-size: 1.05rem;
      letter-spacing: 0.45em;
      transition: opacity 0.2s;
    }
    .nav-overlay a:hover { opacity: 0.5; }
    .nav-close {
      position: absolute;
      top: 14px;
      right: 1.4rem;
      background: none;
      border: none;
      cursor: pointer;
      font-family: "Yu Mincho", "游明朝", serif;
      font-size: 1.5rem;
      color: var(--navy);
      line-height: 1;
    }

    /* ── Page ── */
    .page {
      max-width: 720px;
      margin: 0 auto;
      padding-top: 116px;
    }

    /* ── Title area ── */
    .news-header {
      text-align: center;
      padding: 4rem 1.6rem 3rem;
      border-bottom: 1px solid var(--navy-faint);
      margin-bottom: 3rem;
    }
    .news-category {
      font-size: 0.68rem;
      letter-spacing: 0.35em;
      color: var(--navy);
      opacity: 0.5;
      margin-bottom: 1.2rem;
    }
    .news-title {
      font-size: 1.3rem;
      letter-spacing: 0.12em;
      color: var(--navy);
      line-height: 1.8;
      margin-bottom: 1rem;
    }
    .news-date {
      font-size: 0.78rem;
      letter-spacing: 0.2em;
      color: var(--navy);
      opacity: 0.55;
    }

    /* ── Body area ── */
    .article-body {
      padding: 0 8% 6rem;
    }
    .back-link {
      display: inline-block;
      font-size: 0.72rem;
      letter-spacing: 0.15em;
      color: var(--navy);
      opacity: 0.45;
      text-decoration: none;
      margin-bottom: 3rem;
      transition: opacity 0.2s;
    }
    .back-link:hover { opacity: 0.9; }

    .section-heading {
      font-size: 1rem;
      letter-spacing: 0.12em;
      color: var(--navy);
      padding-bottom: 0.7rem;
      border-bottom: 1px solid var(--navy-faint);
      margin-bottom: 2rem;
      scroll-margin-top: 130px;
    }

    .notion-quote {
      background: #C8DFE8;
      font-size: 0.85em;
      padding: 1em;
      margin-bottom: 2rem;
      line-height: 2.2;
      letter-spacing: 0.04em;
      color: var(--navy);
    }

    .body-text {
      font-size: 0.93rem;
      line-height: 2.2;
      color: var(--navy);
      letter-spacing: 0.04em;
      margin-bottom: 5rem;
    }
    .body-text p {
      text-indent: 0;
      margin-bottom: 2.2em;
      word-break: normal;
      overflow-wrap: break-word;
    }
    .body-text p:last-child { margin-bottom: 0; }

    /* ── Footer ── */
    footer {
      background: #ffffff;
      border-top: 1px solid rgba(1,61,114,0.15);
      padding: 2.8rem 1.6rem;
    }
    .footer-inner {
      max-width: 720px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: stretch;
      gap: 1.5rem;
    }
    .footer-shop-name {
      font-size: 1.05rem;
      letter-spacing: 0.2em;
      color: var(--navy);
      margin-bottom: 0.8rem;
    }
    .footer-info {
      font-size: 0.7rem;
      line-height: 2;
      color: var(--navy);
      letter-spacing: 0.04em;
    }
    .footer-right {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      justify-content: space-between;
    }
    .footer-instagram {
      display: flex;
      align-items: center;
      gap: 0.45em;
      font-size: 0.72rem;
      letter-spacing: 0.12em;
      color: var(--navy);
      text-decoration: none;
      opacity: 0.7;
      transition: opacity 0.2s;
    }
    .footer-instagram:hover { opacity: 1; }
    .footer-copy {
      font-size: 0.6rem;
      letter-spacing: 0.06em;
      color: var(--navy);
      opacity: 0.45;
    }
    @media (max-width: 400px) {
      .footer-shop-name { font-size: 0.9rem; }
      .footer-info { font-size: 0.62rem; }
      .footer-instagram { font-size: 0.62rem; }
      .footer-copy { font-size: 0.55rem; }
    }

    /* ── Fade-in ── */
    .fi {
      opacity: 0;
      transform: translateY(14px);
      transition: opacity 0.75s ease, transform 0.75s ease;
    }
    .fi.vis { opacity: 1; transform: translateY(0); }
  </style>
</head>
<body>

<!-- ══ HEADER ══ -->
<header class="site-header">
  <a href="index.html" class="header-logo">
    <img src="images/kawasoi_logo_vt_transparent.svg" alt="川添い">
  </a>
  <button class="hamburger" id="menuOpen" aria-label="メニューを開く">〜</button>
</header>

<!-- ══ NAV OVERLAY ══ -->
<div class="nav-overlay" id="navOverlay" role="dialog" aria-modal="true">
  <button class="nav-close" id="menuClose" aria-label="メニューを閉じる">〜</button>
  <a href="index.html#statement" onclick="closeMenu()">趣旨</a>
  <a href="tsushin.html"         onclick="closeMenu()">通信</a>
  <a href="index.html#kikaku"    onclick="closeMenu()">企画</a>
  <a href="index.html#store"     onclick="closeMenu()">購買</a>
  <a href="index.html#shozai"    onclick="closeMenu()">所在</a>
</div>

<!-- ══ PAGE ══ -->
<div class="page">

  <!-- タイトルエリア -->
  <div class="news-header fi" id="newsHeader">
    <p class="news-category" id="newsCategory"></p>
    <p class="news-title" id="newsTitle">読み込み中...</p>
    <p class="news-date" id="newsDate"></p>
  </div>

  <!-- 本文エリア -->
  <div class="article-body">
    <a href="news.html" class="back-link fi">← お知らせ一覧に戻る</a>
    <div id="articleContent"></div>
  </div>

  <!-- Footer -->
  <footer>
    <div class="footer-inner">
      <div class="footer-left">
        <p class="footer-shop-name">川<ruby>添<rt style="margin-bottom:0.25em">そ</rt></ruby>い</p>
        <p class="footer-info">
          〒010-1211<br>
          秋田市雄和椿川字小鹿野戸1-18<br>
          E-mail: post@kawasoi.com
        </p>
      </div>
      <div class="footer-right">
        <a href="https://www.instagram.com/" class="footer-instagram" target="_blank" rel="noopener noreferrer">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="2" width="20" height="20" rx="5" ry="5"/>
            <circle cx="12" cy="12" r="4.5"/>
            <circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/>
          </svg>
        </a>
        <p class="footer-copy">© Kawasoi All Rights Reserved.</p>
      </div>
    </div>
  </footer>

</div><!-- /page -->

<script>
  const overlay = document.getElementById('navOverlay');
  document.getElementById('menuOpen').addEventListener('click', () => {
    overlay.classList.add('open');
  });
  document.getElementById('menuClose').addEventListener('click', closeMenu);
  overlay.addEventListener('click', e => { if (e.target === overlay) closeMenu(); });
  function closeMenu() { overlay.classList.remove('open'); }

  const io = new IntersectionObserver(
    entries => entries.forEach(e => {
      if (e.isIntersecting) { e.target.classList.add('vis'); io.unobserve(e.target); }
    }),
    { threshold: 0.08, rootMargin: '0px 0px -20px 0px' }
  );
  document.querySelectorAll('.fi').forEach(el => io.observe(el));

  function formatDate(str) {
    return str ? str.replace(/-/g, '.') : '';
  }

  function blocksToHtml(blocks) {
    let html = '';
    let bodyBuf = [];

    function flushBody() {
      if (bodyBuf.length === 0) return;
      html += `<div class="body-text fi">${bodyBuf.join('')}</div>`;
      bodyBuf = [];
    }

    blocks.forEach(block => {
      const type = block.type;
      const rt = (block[type]?.rich_text || []).map(t => t.plain_text).join('');

      if (type === 'heading_1' || type === 'heading_2' || type === 'heading_3') {
        flushBody();
        html += `<h2 class="section-heading fi" id="${block.id}">${rt}</h2>`;
      } else if (type === 'paragraph') {
        if (rt) bodyBuf.push(`<p>${rt}</p>`);
      } else if (type === 'bulleted_list_item' || type === 'numbered_list_item') {
        if (rt) bodyBuf.push(`<p>・${rt}</p>`);
      } else if (type === 'quote') {
        flushBody();
        const childHtml = (block.quoteChildren || []).map(c => {
          const crt = (c[c.type]?.rich_text || []).map(t => t.plain_text).join('');
          return crt ? `<p>${crt}</p>` : '';
        }).join('');
        const quoteContent = (rt ? `<p>${rt}</p>` : '') + childHtml;
        if (quoteContent) html += `<blockquote class="notion-quote fi">${quoteContent}</blockquote>`;
      } else if (type === 'image' && block.imageUrl) {
        flushBody();
        html += `<img src="${block.imageUrl}" alt="" class="fi" style="width:100%;display:block;margin:2rem 0;">`;
      }
    });

    flushBody();
    return html;
  }

  async function loadArticle() {
    const params = new URLSearchParams(location.search);
    const id = params.get('id');

    if (!id) {
      document.getElementById('newsTitle').textContent = '記事が見つかりません';
      return;
    }

    try {
      const res = await fetch(`/api/notion?type=news&id=${encodeURIComponent(id)}`);
      const data = await res.json();

      const props = data.page?.properties || {};
      const category = props['カテゴリ']?.select?.name || '';
      const dateStr = formatDate(props['日付']?.date?.start || '');
      const title = (props['タイトル']?.title || []).map(t => t.plain_text).join('');
      const bodyProp = (props['本文']?.rich_text || []).map(t => t.plain_text).join('');

      document.getElementById('newsCategory').textContent = category;
      document.getElementById('newsDate').textContent = dateStr;
      document.getElementById('newsTitle').textContent = title || 'お知らせ';
      if (title) document.title = `${title} — お知らせ | 川添い`;

      const content = document.getElementById('articleContent');
      const blocks = data.blocks || [];

      // rich_textプロパティの本文があれば優先、なければブロックを使用
      if (bodyProp) {
        const paras = bodyProp.split(/\n+/).filter(Boolean);
        content.innerHTML = `<div class="body-text fi">${paras.map(p => `<p>${p}</p>`).join('')}</div>`;
      } else if (blocks.length > 0) {
        content.innerHTML = blocksToHtml(blocks);
      } else {
        content.innerHTML = '<div class="body-text fi"><p>本文がありません。</p></div>';
      }

      content.querySelectorAll('.fi').forEach(el => io.observe(el));
    } catch (e) {
      document.getElementById('newsTitle').textContent = '記事の取得に失敗しました';
    }
  }

  loadArticle();
</script>

</body>
</html>
